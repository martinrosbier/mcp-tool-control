include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

stages:
  - test
  - build
  - security

.node_job:
  image: node:22-bookworm-slim
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit

typecheck:
  extends: .node_job
  stage: test
  script:
    - npm run typecheck

format:
  extends: .node_job
  stage: test
  script:
    - npm run format:check

lint:
  extends: .node_job
  stage: test
  script:
    - npm run lint

test:
  extends: .node_job
  stage: test
  script:
    - npm test

build:
  extends: .node_job
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

dependency_audit:
  extends: .node_job
  stage: security
  script:
    - npm audit --audit-level=high

secret_detection:
  stage: security
